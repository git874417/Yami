server {
    listen 80;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Intenta servir el archivo solicitado ($uri), si no existe,
        # sirve el index.html
        try_files $uri $uri/ /index.html;
    }

    #Redirige peticiones de la API al backend
    location /api/ {
        # backend es el nombre del servicio de backend en el docker-compose
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }   

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}